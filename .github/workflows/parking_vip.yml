name: Parking Registration vip

on:
  repository_dispatch:
    types: [run-parking-vip]
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

# 정각 cron과 수동/텔레그램 실행이 겹칠 때 커밋 충돌 방지
concurrency:
  group: parking-vip
  cancel-in-progress: false

env:
  WORKER_URL: https://u-tower-parking-telegram.ypd0004.workers.dev

jobs:
  run-parking-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    # 차량 목록은 GitHub에 두지 않고 Cloudflare KV에서 받아옵니다 (로그에 출력 금지)
    - name: Fetch vehicle lists from Cloudflare
      env:
        LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
      run: |
        curl -sf -H "Authorization: Bearer $LIST_TOKEN" "$WORKER_URL/lists" -o lists.json
        python -c "import json; d = json.load(open('lists.json', encoding='utf-8')); [open(n, 'w', encoding='utf-8').write(d.get(k) or '') for k, n in [('vip_list', 'vip_list.txt'), ('car_list', 'cars.txt'), ('blacklist', 'blacklist.txt')]]"
        rm lists.json

    - name: Run Parking Bot
      env:
        USER1_ID: ${{ secrets.USER1_ID }} #B733
        USER1_PW: ${{ secrets.USER1_PW }}
        USER2_ID: ${{ secrets.USER2_ID }} #C132
        USER2_PW: ${{ secrets.USER2_PW }}
        USER3_ID: ${{ secrets.USER3_ID }} #C132
        USER3_PW: ${{ secrets.USER3_PW }}
        USER4_ID: ${{ secrets.USER4_ID }} #A307
        USER4_PW: ${{ secrets.USER4_PW }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
      run: |
        python parking_bot_vip.py

    # /상태 조회용 status도 GitHub 커밋 대신 Cloudflare KV에 저장합니다
    - name: Upload status to Cloudflare
      env:
        LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
      run: |
        curl -sf -X POST -H "Authorization: Bearer $LIST_TOKEN" \
          --data-binary @data/status.json "$WORKER_URL/status"

    - name: Generate HTML Report
      run: |
        python generate_report.py

    - name: Commit stats and report
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add data/parking_stats.db docs/index.html
        git diff --staged --quiet || (git commit -m "Chore: Update parking stats and report" && git pull --rebase && git push)
