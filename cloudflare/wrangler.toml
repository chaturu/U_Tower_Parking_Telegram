name = "u-tower-parking-telegram"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# UTC 23시, 0~11시 정각 = KST 08~20시 정각 (하루 13회)
[triggers]
crons = ["0 23,0-11 * * *"]

[vars]
GITHUB_REPO = "chaturu/U_Tower_Parking_Telegram"

# 시크릿은 `wrangler secret put <이름>`으로 등록합니다 (코드에 넣지 마세요):
#   TELEGRAM_BOT_TOKEN  - 텔레그램 봇 토큰
#   WEBHOOK_SECRET      - setWebhook의 secret_token과 동일한 임의 문자열
#   GH_TOKEN            - GitHub fine-grained PAT (이 저장소 Contents Read/Write)
#   MASTER_CHAT_ID      - 마스터(관리자) 텔레그램 채팅 ID
